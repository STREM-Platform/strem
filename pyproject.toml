[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = "(^|/)(\\.venv|venv|build|dist|alembic)/"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Prose-heavy content: athlete-facing engine copy and model instructions.
"app/race/engine/*.py" = ["E501"]
"app/race/ai/prompts.py" = ["E501"]
