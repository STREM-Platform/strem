# STREM local development infrastructure + MVP service stack.
#
# Broker decision (see strem-docs/architecture/event-driven-strategy.md):
# Redis Streams is the MVP message broker. Redis is already required for cache
# and rate limiting, and Redis Streams can serve double duty as the broker —
# avoiding a third stateful service (NATS/RabbitMQ). Revisit when event volume
# or routing complexity justifies a dedicated broker (write an ADR then).
#
# Layout assumption: the service repositories are cloned as siblings of
# strem-infra under one parent directory, so each service's build context is
# ../../strem-<service> relative to this file. Service containers are included
# only now that every repo has a Dockerfile and a GET /health endpoint.
#
# Local ports: postgres 5432, redis 6379, gateway 8000, auth 8001, user 8002,
# training 8003, nutrition 8004, community 8005, ai 8006. Each service listens on
# 8000 inside its container.

x-service-health: &service-health
  interval: 10s
  timeout: 5s
  retries: 5

x-healthcheck-cmd: &healthcheck-cmd
  test:
    - CMD
    - python
    - -c
    - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-strem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strem}
      POSTGRES_DB: ${POSTGRES_DB:-strem}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # One database per service is created on first boot (data ownership rule:
      # strem-docs/architecture/database-strategy.md).
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-strem}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # appendonly keeps Redis Streams durable across restarts.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  auth:
    build: ../../strem-auth-service
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-strem}:${POSTGRES_PASSWORD:-strem}@postgres:5432/strem_auth
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-only}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "30"
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      <<: [*healthcheck-cmd, *service-health]
    restart: unless-stopped

  user:
    build: ../../strem-user-service
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-strem}:${POSTGRES_PASSWORD:-strem}@postgres:5432/strem_user
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-only}
      JWT_ALGORITHM: HS256
      MESSAGE_BROKER_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      <<: [*healthcheck-cmd, *service-health]
    restart: unless-stopped

  user-worker:
    build: ../../strem-user-service
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-strem}:${POSTGRES_PASSWORD:-strem}@postgres:5432/strem_user
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-only}
      JWT_ALGORITHM: HS256
      MESSAGE_BROKER_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  training:
    build: ../../strem-training-service
    ports:
      - "8003:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-strem}:${POSTGRES_PASSWORD:-strem}@postgres:5432/strem_training
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-only}
      JWT_ALGORITHM: HS256
      MESSAGE_BROKER_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      <<: [*healthcheck-cmd, *service-health]
    restart: unless-stopped

  nutrition:
    build: ../../strem-nutrition-service
    ports:
      - "8004:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-strem}:${POSTGRES_PASSWORD:-strem}@postgres:5432/strem_nutrition
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-only}
      JWT_ALGORITHM: HS256
      MESSAGE_BROKER_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      <<: [*healthcheck-cmd, *service-health]
    restart: unless-stopped

  community:
    build: ../../strem-community-service
    ports:
      - "8005:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-strem}:${POSTGRES_PASSWORD:-strem}@postgres:5432/strem_community
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-only}
      JWT_ALGORITHM: HS256
      MESSAGE_BROKER_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      <<: [*healthcheck-cmd, *service-health]
    restart: unless-stopped

  community-worker:
    build: ../../strem-community-service
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-strem}:${POSTGRES_PASSWORD:-strem}@postgres:5432/strem_community
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-only}
      JWT_ALGORITHM: HS256
      MESSAGE_BROKER_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  ai:
    build: ../../strem-ai-orchestrator
    ports:
      - "8006:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-strem}:${POSTGRES_PASSWORD:-strem}@postgres:5432/strem_ai
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-only}
      JWT_ALGORITHM: HS256
      MESSAGE_BROKER_URL: redis://redis:6379/0
      USER_SERVICE_BASE_URL: http://user:8000/v1
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      <<: [*healthcheck-cmd, *service-health]
    restart: unless-stopped

  gateway:
    build: ../../strem-api-gateway
    ports:
      - "8000:8000"
    environment:
      AUTH_BASE_URL: http://auth:8000/v1
      USER_BASE_URL: http://user:8000/v1
      TRAINING_BASE_URL: http://training:8000/v1
      NUTRITION_BASE_URL: http://nutrition:8000/v1
      COMMUNITY_BASE_URL: http://community:8000/v1
      AI_BASE_URL: http://ai:8000/v1
      # Shared rate-limit counters (the gateway fails open if Redis is down).
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - auth
      - user
      - training
      - nutrition
      - community
      - ai
      - redis
    healthcheck:
      <<: [*healthcheck-cmd, *service-health]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
