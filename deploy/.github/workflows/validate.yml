name: Validate

# Catches Docker Compose syntax/config errors on every PR and push to main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose config
        run: docker compose -f docker/docker-compose.yml config --quiet
        env:
          # config interpolates env vars; provide the same safe local defaults.
          POSTGRES_USER: strem
          POSTGRES_PASSWORD: strem
          POSTGRES_DB: strem
