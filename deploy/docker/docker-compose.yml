# STREM local development infrastructure + MVP service stack.
#
# Redis backs the gateway's shared rate limiting.
#
# Build contexts are the service folders of this monorepo (../../services/*).
#
# Local ports: postgres 5432, redis 6379, gateway 8000, auth 8001, user 8002,
# training 8003, ai 8006. Each service listens on 8000 inside its container.

x-service-health: &service-health
  interval: 10s
  timeout: 5s
  retries: 5

x-healthcheck-cmd: &healthcheck-cmd
  test:
    - CMD
    - python
    - -c
    - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-strem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strem}
      POSTGRES_DB: ${POSTGRES_DB:-strem}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # One database per service is created on first boot (each service owns its data).
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-strem}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # appendonly keeps Redis Streams durable across restarts.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  auth:
    build: ../../services/auth
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-strem}:${POSTGRES_PASSWORD:-strem}@postgres:5432/strem_auth
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-only}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "30"
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      <<: [*healthcheck-cmd, *service-health]
    restart: unless-stopped

  user:
    build: ../../services/user
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-strem}:${POSTGRES_PASSWORD:-strem}@postgres:5432/strem_user
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-only}
      JWT_ALGORITHM: HS256
      # Private course files and training plans live in training-service behind
      # one deletion fence (docs#26): export and purge go through it.
      COURSE_STORAGE_BASE_URL: http://training:8000
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      <<: [*healthcheck-cmd, *service-health]
    restart: unless-stopped

  training:
    build: ../../services/training
    ports:
      - "8003:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-strem}:${POSTGRES_PASSWORD:-strem}@postgres:5432/strem_training
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-only}
      JWT_ALGORITHM: HS256
      # Connected-source ingestion (A3). Empty key → connecting a source is
      # refused; empty provider creds → that provider can't be connected. The
      # rest of the service runs regardless.
      INTEGRATIONS_ENCRYPTION_KEY: ${INTEGRATIONS_ENCRYPTION_KEY:-}
      WHOOP_CLIENT_ID: ${WHOOP_CLIENT_ID:-}
      WHOOP_CLIENT_SECRET: ${WHOOP_CLIENT_SECRET:-}
      WHOOP_REDIRECT_URI: ${WHOOP_REDIRECT_URI:-}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      STRAVA_REDIRECT_URI: ${STRAVA_REDIRECT_URI:-}
      # Mission ownership and the deletion-fence generation come from user-service.
      USER_SERVICE_BASE_URL: http://user:8000/v1
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      <<: [*healthcheck-cmd, *service-health]
    restart: unless-stopped

  ai:
    build: ../../services/ai
    ports:
      - "8006:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-strem}:${POSTGRES_PASSWORD:-strem}@postgres:5432/strem_ai
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-only}
      JWT_ALGORITHM: HS256
      # The race team reads context from and writes plans/layers through these
      # (in-network hostnames, not localhost, inside Docker).
      USER_SERVICE_BASE_URL: http://user:8000/v1
      TRAINING_SERVICE_BASE_URL: http://training:8000/v1
      # Race OS race team (docs#26). Without a key or credit the race engine
      # still builds every layer and the app says the AI is offline.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RACE_MODEL: ${RACE_MODEL:-claude-opus-5-5}
      # Or OpenAI GPT (ai#42): AI_PROVIDER=openai, or leave it empty and set only
      # OPENAI_API_KEY. Same rules, race context and schemas for either provider.
      AI_PROVIDER: ${AI_PROVIDER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6.1-sol}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-60}
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      <<: [*healthcheck-cmd, *service-health]
    restart: unless-stopped

  gateway:
    build: ../../services/gateway
    ports:
      - "8000:8000"
    environment:
      AUTH_BASE_URL: http://auth:8000/v1
      USER_BASE_URL: http://user:8000/v1
      TRAINING_BASE_URL: http://training:8000/v1
      AI_BASE_URL: http://ai:8000/v1
      # Shared rate-limit counters (the gateway fails open if Redis is down).
      REDIS_URL: redis://redis:6379/0
      # AI race-team builds make several model calls; allow up to 3 minutes.
      UPSTREAM_TIMEOUT_SECONDS: "300"
    depends_on:
      - auth
      - user
      - training
      - ai
      - redis
    healthcheck:
      <<: [*healthcheck-cmd, *service-health]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
